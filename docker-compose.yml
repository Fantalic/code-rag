services:
  lightrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lightrag-server
    ports:
      - "9621:9621"
    volumes:
      - rag_data:/app/data
      - ./rag_input:/app/data/inputs
    environment:
      - LLM_BINDING_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - EMBEDDING_BINDING_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LLM_MODEL=qwen3-coder:480b-cloud
      - EMBEDDING_MODEL=bge-m3:latest
      - EMBEDDING_DIM=1024
      - WORKSPACE=${WORKSPACE:-}
      - WORKING_DIR=/app/data/rag_storage
      - INPUT_DIR=/app/data/inputs
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lightrag-mcp
    ports:
      - "9622:9622"
    depends_on:
      - lightrag
    environment:
      - LIGHTRAG_URL=http://lightrag:9621
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9622
    command: ["python", "-m", "daniel_lightrag_mcp.sse_server"]
    restart: unless-stopped

volumes:
  rag_data:
