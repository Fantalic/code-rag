name: coderag

services:
  lightrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lightrag-server
    ports:
      - "9621:9621"
    volumes:
      - rag_data:/app/data
      - ./rag_input:/app/data/inputs
    # host-gateway makes host.docker.internal resolve under rootless Podman too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_BINDING_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - EMBEDDING_BINDING_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-phi3.5:latest}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3:latest}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - WORKSPACE=${WORKSPACE:-}
      - WORKING_DIR=/app/data/rag_storage
      - INPUT_DIR=/app/data/inputs
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coderag-mcp
    ports:
      - "9622:9622"
    depends_on:
      - lightrag
    environment:
      - LIGHTRAG_URL=http://lightrag:9621
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9622
    command: ["python", "-m", "coderag_mcp.sse_server"]
    restart: unless-stopped

volumes:
  rag_data:
