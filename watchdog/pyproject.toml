[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codelightrag-watchdog"
version = "0.1.0"
description = "CodeLightRAG file watchdog — auto-ingest files into LightRAG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CodeLightRAG Contributors"}
]
dependencies = [
    "watchdog>=4.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["watchdog*"]
