services:
  lightrag:
    container_name: lightrag
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    ports:
      - "${PORT:-9621}:9621"
    volumes:
      - ${INPUT_DIR}:app/codebase
      - ${INPUT_DIR}/.lightrag/rag_storage:/app/working
      - ${INPUT_DIR}/.lightrag/inputs:/app/data/inputs
      - ./config.ini:/app/config.ini
      - ./.env:/app/.env
      - ${INPUT_DIR}/.lightrag/graph_data:/app/code
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
